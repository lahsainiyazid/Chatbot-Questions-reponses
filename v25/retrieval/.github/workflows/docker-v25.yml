name: Build and Push v25 Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'v25/retrieval/**'
      - '.github/workflows/docker-v25.yml'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: v25/retrieval
          file: v25/retrieval/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-v25:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/chatbot-v25:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
